# Перевіряє самі автотести на еталонних конфігураціях викладача.
# Запускається лише якщо в репозиторії є тека teacher/.
name: selftest

on:
  push:
    paths: ["tests/**", "teacher/**", "pytest.ini"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    if: ${{ hashFiles('teacher/**') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest teacher -p no:cacheprovider
